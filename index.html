<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Diwali, Devi Ji ✨ | From Utkarsh</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Marcellus&family=Rozha+One&display=swap" rel="stylesheet">

<style>

/* =====================================================
   ROOT
===================================================== */

:root{
    --gold:#f5c04e;
    --gold-light:#ffe29a;
    --orange:#ff7a00;
    --dark:#08030a;
    --wine:#260817;
}


/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}


/* =====================================================
   BODY
===================================================== */

body{
    min-height:200vh;
    overflow-x:hidden;

    color:white;

    font-family:'Marcellus',serif;

    background:
        radial-gradient(
            circle at 50% 20%,
            #3a0c27 0%,
            #160711 38%,
            #08030a 85%
        );
}


/* =====================================================
   GOLDEN PARTICLE CANVAS
===================================================== */

#sparkleCanvas{
    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    pointer-events:none;

    z-index:1;
}


/* =====================================================
   COMMON SECTION
===================================================== */

section{
    min-height:100vh;
    width:100%;

    position:relative;
    z-index:2;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    padding:30px 20px;

    text-align:center;
}


/* =====================================================
   SCENE 1
===================================================== */

#scene1{
    background:
        radial-gradient(
            circle at center,
            rgba(111,23,52,.22),
            transparent 65%
        );
}


/* =====================================================
   TOP LABEL
===================================================== */

.sender-top-tag{
    padding:8px 22px;

    border-radius:50px;

    background:
        rgba(245,192,78,.08);

    border:
        1px solid rgba(245,192,78,.45);

    color:var(--gold-light);

    font-size:.78rem;

    letter-spacing:3px;

    text-transform:uppercase;

    margin-bottom:18px;

    box-shadow:
        0 0 25px
        rgba(245,192,78,.08);
}


/* =====================================================
   DIYA INSTRUCTION
===================================================== */

.scene-1-hint{
    color:#ffe5ad;

    font-size:.95rem;

    letter-spacing:2px;

    margin-bottom:20px;

    animation:
        pulseHint 2s infinite ease-in-out;
}


/* =====================================================
   DIYA MANDALA
===================================================== */

.diya-circle-container{

    position:relative;

    width:340px;
    height:340px;

    display:flex;

    align-items:center;
    justify-content:center;

    margin:10px auto;
}


/* Decorative circle */

.diya-circle-container::before{

    content:"";

    position:absolute;

    width:275px;
    height:275px;

    border-radius:50%;

    border:
        1px solid
        rgba(245,192,78,.15);

    box-shadow:
        0 0 60px
        rgba(255,150,0,.08),

        inset 0 0 40px
        rgba(255,150,0,.04);
}


/* =====================================================
   CENTER DIYA
===================================================== */

.center-diya{

    width:120px;
    height:90px;

    cursor:pointer;

    z-index:10;

    filter:
        drop-shadow(
            0 0 28px
            rgba(255,145,0,.95)
        );

    transition:
        transform .3s ease;
}

.center-diya:hover{
    transform:scale(1.12);
}


/* =====================================================
   RADIAL DIYAS
===================================================== */

.radial-diya{

    position:absolute;

    width:55px;
    height:42px;

    opacity:0;

    transform:scale(0);

    filter:
        drop-shadow(
            0 0 18px
            rgba(255,170,0,.8)
        );

    transition:
        opacity 1s ease,

        transform
        1s cubic-bezier(
            .18,.89,.32,1.28
        );
}

.diya-circle-container.expanded
.radial-diya{

    opacity:1;

    transform:scale(1);
}


/* =====================================================
   FLAME
===================================================== */

.diya-flame{

    animation:
        flicker
        1.5s
        infinite
        alternate
        ease-in-out;

    transform-origin:
        bottom center;
}


/* =====================================================
   FIRST MESSAGE
===================================================== */

.path-msg{

    max-width:620px;

    margin-top:30px;

    color:#ffe7b0;

    font-size:
        clamp(
            1.05rem,
            3.5vw,
            1.55rem
        );

    line-height:1.8;

    font-style:italic;

    opacity:0;

    transform:translateY(25px);

    transition:
        all 1.2s ease .5s;

    text-shadow:
        0 0 22px
        rgba(255,190,90,.35);
}

.path-msg.revealed{

    opacity:1;

    transform:translateY(0);
}


/* =====================================================
   SCENE 2
===================================================== */

#scene2{

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(78,12,45,.5),
            transparent 70%
        );
}


/* =====================================================
   AARTI STAGE
===================================================== */

.aarti-stage{

    position:relative;

    width:300px;
    height:380px;

    margin:20px auto 35px;
}


/* =====================================================
   PERMANENT PHOTO FRAME
===================================================== */

.photo-frame{

    width:100%;
    height:100%;

    padding:8px;

    border-radius:
        150px 150px 22px 22px;

    border:
        3px solid
        var(--gold);

    background:
        linear-gradient(
            145deg,
            rgba(245,192,78,.25),
            rgba(20,5,15,.95)
        );

    box-shadow:

        0 0 55px
        rgba(255,140,0,.38),

        inset 0 0 30px
        rgba(245,192,78,.2);
}


/* Permanent photo */

.photo-frame img{

    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    border-radius:
        143px 143px 16px 16px;

    transition:
        transform .7s ease,
        filter .7s ease;
}

.photo-frame:hover img{

    transform:scale(1.04);

    filter:brightness(1.08);
}


/* =====================================================
   PROFESSIONAL AARTI THALI
===================================================== */

.aarti-thali{

    position:absolute;

    top:50%;
    left:50%;

    width:105px;
    height:105px;

    z-index:20;

    pointer-events:none;

    animation:
        aartiOrbit
        7s
        infinite
        linear;

    filter:
        drop-shadow(
            0 0 12px
            rgba(255,180,30,.8)
        )

        drop-shadow(
            0 0 30px
            rgba(255,120,0,.35)
        );
}


/* =====================================================
   AARTI GOLDEN AURA
===================================================== */

.aarti-thali::before{

    content:"";

    position:absolute;

    width:145px;
    height:145px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,

            rgba(255,190,50,.22)
            0%,

            rgba(255,130,0,.08)
            40%,

            transparent 72%
        );

    animation:
        aartiGlow
        2s
        infinite
        alternate
        ease-in-out;
}


/* =====================================================
   AARTI ORBIT RING
===================================================== */

.aarti-thali::after{

    content:"";

    position:absolute;

    width:220px;
    height:220px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    border:
        1px solid
        rgba(255,200,80,.12);

    box-shadow:
        0 0 25px
        rgba(255,170,30,.08);

    opacity:.7;
}


/* =====================================================
   SMOOTH CLOCKWISE AARTI
===================================================== */

@keyframes aartiOrbit{

    0%{

        transform:
            translate(
                calc(-50% + 0px),
                calc(-50% + 150px)
            )
            scale(1.12)
            rotate(0deg);
    }

    25%{

        transform:
            translate(
                calc(-50% + 145px),
                calc(-50% + 55px)
            )
            scale(1.02)
            rotate(90deg);
    }

    50%{

        transform:
            translate(
                calc(-50% + 0px),
                calc(-50% - 115px)
            )
            scale(.88)
            rotate(180deg);
    }

    75%{

        transform:
            translate(
                calc(-50% - 145px),
                calc(-50% + 55px)
            )
            scale(1.02)
            rotate(270deg);
    }

    100%{

        transform:
            translate(
                calc(-50% + 0px),
                calc(-50% + 150px)
            )
            scale(1.12)
            rotate(360deg);
    }
}


/* =====================================================
   AARTI GLOW
===================================================== */

@keyframes aartiGlow{

    0%{

        opacity:.45;

        transform:
            translate(-50%,-50%)
            scale(.85);
    }

    100%{

        opacity:.9;

        transform:
            translate(-50%,-50%)
            scale(1.12);
    }
}


/* =====================================================
   MESSAGE AREA
===================================================== */

.quote-box{

    width:100%;

    max-width:700px;
}


/* =====================================================
   MAIN MESSAGE
===================================================== */

.goddess-msg{

    max-width:680px;

    margin:auto;

    color:#fff1d5;

    font-size:
        clamp(
            1.25rem,
            4vw,
            1.85rem
        );

    line-height:1.7;

    font-style:italic;

    text-shadow:
        0 0 28px
        rgba(255,160,0,.45);
}


/* =====================================================
   DIWALI TITLE
===================================================== */

.devi-title{

    margin-top:24px;

    font-family:
        'Cinzel Decorative',
        cursive;

    font-size:
        clamp(
            1.9rem,
            6vw,
            3.3rem
        );

    background:
        linear-gradient(
            135deg,
            #fff8df 10%,
            #f5c04e 52%,
            #ff6900 100%
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    letter-spacing:2px;

    filter:
        drop-shadow(
            0 0 20px
            rgba(245,192,78,.55)
        );
}


/* =====================================================
   SIGNATURE
===================================================== */

.sender-signature{

    margin-top:35px;

    color:var(--gold);

    font-family:
        'Cinzel Decorative',
        cursive;

    font-size:.9rem;

    letter-spacing:2px;

    line-height:2;
}


.sender-signature span{

    display:inline-block;

    margin-top:5px;

    font-family:
        'Rozha One',
        serif;

    font-size:2rem;

    background:
        linear-gradient(
            135deg,
            white,
            #ffe494,
            #f5c04e
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    filter:
        drop-shadow(
            0 0 15px
            rgba(245,192,78,.6)
        );
}


/* =====================================================
   FLAME ANIMATION
===================================================== */

@keyframes flicker{

    0%{

        transform:
            scale(1)
            rotate(-1deg);
    }

    50%{

        transform:
            scale(1.1,.95)
            rotate(1.5deg);
    }

    100%{

        transform:
            scale(.95,1.05)
            rotate(-2deg);
    }
}


/* =====================================================
   HINT ANIMATION
===================================================== */

@keyframes pulseHint{

    0%,100%{

        opacity:.6;

        transform:
            scale(.98);
    }

    50%{

        opacity:1;

        transform:
            scale(1.02);
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:500px){

    .diya-circle-container{

        width:300px;
        height:300px;
    }


    .aarti-stage{

        width:270px;
        height:350px;
    }


    .aarti-thali{

        width:85px;
        height:85px;
    }


    .sender-top-tag{

        font-size:.68rem;

        letter-spacing:2px;
    }


    .scene-1-hint{

        font-size:.8rem;
    }


    .sender-signature span{

        font-size:1.7rem;
    }
}

</style>
</head>

<!-- =====================================================
     SVG GRADIENTS
===================================================== -->

<svg width="0" height="0">

    <!-- FLAME -->

        id="flameGrad"

<script>


/* =====================================================
   CREATE 8 RADIAL DIYAS
===================================================== */

const container =
    document.getElementById(
        "diyaContainer"
    );

const totalDiyas = 8;

const radius = 115;


for(
    let i = 0;
    i < totalDiyas;
    i++
){

    const angle =
        (i / totalDiyas) *
        Math.PI *
        2;


    const x =
        Math.round(
            radius *
            Math.cos(angle)
        );


    const y =
        Math.round(
            radius *
            Math.sin(angle)
        );


    const diya =
        document.createElement(
            "div"
        );


    diya.className =
        "radial-diya";


    diya.style.left =
        `calc(50% + ${x}px - 27px)`;


    diya.style.top =
        `calc(50% + ${y}px - 21px)`;


    diya.innerHTML = `

        <svg
            viewBox="0 0 140 100"
            fill="none"
        >

            <g class="diya-flame">

                <path
                    d="M70 12 C73 24,85 36,78 52 C74 60,66 60,62 52 C55 36,67 24,70 10Z"
                    fill="url(#flameGrad)"
                />

            </g>


            <path
                d="M20 56 C20 84,120 84,120 56 C120 50,20 50,20 56Z"
                fill="url(#clayGrad)"
                stroke="#f5c04e"
                stroke-width="2"
            />

        </svg>

    `;


    container.appendChild(diya);

}


/* =====================================================
   DIYA TAP EVENT
===================================================== */

let hasTriggered = false;


function igniteDiyaCircle(){

    if(hasTriggered)
        return;


    hasTriggered = true;


    playChimeSound();


    container.classList.add(
        "expanded"
    );


    document.getElementById(
        "tapHint"
    ).style.opacity = "0";


    document.getElementById(
        "pathMsg"
    ).classList.add(
        "revealed"
    );


    /* ==========================================
       ROTATE OUTER DIYAS
    ========================================== */

    let rotation = 0;


    setInterval(() => {

        rotation += .35;


        const diyas =
            document.querySelectorAll(
                ".radial-diya"
            );


        diyas.forEach(
            (d,index) => {

                const angle =
                    (index /
                    totalDiyas) *
                    Math.PI *
                    2
                    +
                    rotation *
                    Math.PI /
                    180;


                const x =
                    Math.round(
                        radius *
                        Math.cos(angle)
                    );


                const y =
                    Math.round(
                        radius *
                        Math.sin(angle)
                    );


                d.style.left =
                    `calc(50% + ${x}px - 27px)`;


                d.style.top =
                    `calc(50% + ${y}px - 21px)`;

            }
        );

    },30);


    /* ==========================================
       AUTO SCROLL
    ========================================== */

    setTimeout(() => {

        document.getElementById(
            "scene2"
        ).scrollIntoView({
            behavior:"smooth"
        });

    },3200);

}


/* =====================================================
   TEMPLE CHIME
===================================================== */

function playChimeSound(){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        const audio =
            new AudioContext();


        const frequencies =
            [
                528,
                660,
                792,
                1056
            ];


        frequencies.forEach(
            (frequency,index)=>{

                const oscillator =
                    audio.createOscillator();


                const gain =
                    audio.createGain();


                oscillator.type =
                    "sine";


                oscillator.frequency.setValueAtTime(
                    frequency,
                    audio.currentTime +
                    index * .1
                );


                gain.gain.setValueAtTime(
                    .18,
                    audio.currentTime +
                    index * .1
                );


                gain.gain.exponentialRampToValueAtTime(
                    .001,
                    audio.currentTime +
                    3
                );


                oscillator.connect(
                    gain
                );


                gain.connect(
                    audio.destination
                );


                oscillator.start(
                    audio.currentTime +
                    index * .1
                );


                oscillator.stop(
                    audio.currentTime +
                    3
                );

            }
        );

    }

    catch(error){

        /* Browser audio fallback */

    }

}


/* =====================================================
   GOLDEN PARTICLES
===================================================== */

const canvas =
    document.getElementById(
        "sparkleCanvas"
    );


const ctx =
    canvas.getContext("2d");


let particles = [];


function resizeCanvas(){

    canvas.width =
        window.innerWidth;


    canvas.height =
        window.innerHeight;

}


window.addEventListener(
    "resize",
    resizeCanvas
);


resizeCanvas();


/* Create particles */

for(
    let i=0;
    i<55;
    i++
){

    particles.push({

        x:
            Math.random() *
            canvas.width,

        y:
            Math.random() *
            canvas.height,

        radius:
            Math.random()*2+
            .5,

        alpha:
            Math.random()*.7+
            .2,

        speed:
            Math.random()*.6+
            .15,

        drift:
            (Math.random()-.5)*
            .4

    });

}


/* Animate particles */

function animateParticles(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    particles.forEach(
        p=>{

            ctx.globalAlpha =
                p.alpha;


            ctx.fillStyle =
                "#ffd679";


            ctx.beginPath();


            ctx.arc(
                p.x,
                p.y,
                p.radius,
                0,
                Math.PI*2
            );


            ctx.fill();


            p.y -=
                p.speed;


            p.x +=
                p.drift;


            if(
                p.y < -10
            ){

                p.y =
                    canvas.height + 10;

                p.x =
                    Math.random() *
                    canvas.width;

            }


            if(
                p.x < -10 ||
                p.x >
                canvas.width + 10
            ){

                p.x =
                    Math.random() *
                    canvas.width;

            }

        }
    );


    requestAnimationFrame(
        animateParticles
    );

}


animateParticles();

</script>
